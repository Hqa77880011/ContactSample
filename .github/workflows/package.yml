name: Package
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q contactsample
      - run: python -m pip install build pyflakes
      - run: python -m pyflakes contactsample
      - run: python -m build
